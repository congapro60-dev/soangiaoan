name: Quality Gate (Agent Skills)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Senior Engineer Rule - Type Checking Let it Fail
      run: npm run lint
      # This step ensures AI doesn't write code with TypeScript errors.
      
    - name: AI Guardrails - Run Tests
      run: npm run test -- --run
      # This step ensures TDD functions don't break.
