<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" role="img" aria-label="Thang chữ A: hai chân thang là hai cát tuyến cắt ba bậc ngang song song, lần lượt tại A, B, C và A', B', C'">
  <line x1="30" y1="280" x2="410" y2="280" stroke="#0f172a" stroke-width="2"/>
  <line x1="210" y1="40" x2="80" y2="270" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <line x1="210" y1="40" x2="340" y2="270" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <line x1="176" y1="100" x2="244" y2="100" stroke="#2563eb" stroke-width="3"/>
  <line x1="137" y1="170" x2="284" y2="170" stroke="#2563eb" stroke-width="3"/>
  <line x1="97" y1="240" x2="323" y2="240" stroke="#2563eb" stroke-width="3"/>
  <circle cx="176" cy="100" r="3.5" fill="#0f172a"/>
  <circle cx="137" cy="170" r="3.5" fill="#0f172a"/>
  <circle cx="97" cy="240" r="3.5" fill="#0f172a"/>
  <circle cx="244" cy="100" r="3.5" fill="#7c3aed"/>
  <circle cx="284" cy="170" r="3.5" fill="#7c3aed"/>
  <circle cx="323" cy="240" r="3.5" fill="#7c3aed"/>
  <text x="182" y="116" font-size="15" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">A</text>
  <text x="112" y="192" font-size="15" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">B</text>
  <text x="62" y="262" font-size="15" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">C</text>
  <text x="248" y="94" font-size="15" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#7c3aed">A'</text>
  <text x="288" y="164" font-size="15" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#7c3aed">B'</text>
  <text x="330" y="234" font-size="15" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#7c3aed">C'</text>
  <text x="152" y="212" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#2563eb">ba bậc song song</text>
  <text x="40" y="306" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#334155">AB/BC = A'B'/B'C' (= 1 khi ba bậc cách đều)</text>
</svg>
