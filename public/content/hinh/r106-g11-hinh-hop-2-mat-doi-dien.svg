<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-label="Hình hộp ABCD.A'B'C'D': mặt đáy (ABB'A') và mặt đối diện (DCC'D') song song nhau">
  <polygon points="70,200 250,200 310,160 130,160" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <polygon points="70,100 250,100 310,60 130,60" fill="none" stroke="#0f172a" stroke-width="2"/>
  <line x1="70" y1="200" x2="70" y2="100" stroke="#0f172a" stroke-width="2"/>
  <line x1="250" y1="200" x2="250" y2="100" stroke="#0f172a" stroke-width="2"/>
  <line x1="310" y1="160" x2="310" y2="60" stroke="#0f172a" stroke-width="2"/>
  <line x1="130" y1="160" x2="130" y2="60" stroke="#0f172a" stroke-width="2"/>
  <polygon points="70,200 250,200 250,100 70,100" fill="#dbeafe" fill-opacity="0.65" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="130,160 310,160 310,60 130,60" fill="#dcfce7" fill-opacity="0.65" stroke="#16a34a" stroke-width="2.5"/>
  <text x="56" y="222" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">A</text>
  <text x="258" y="222" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">B</text>
  <text x="318" y="178" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">C</text>
  <text x="108" y="178" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">D</text>
  <text x="56" y="92" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">A'</text>
  <text x="262" y="92" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">B'</text>
  <text x="318" y="50" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">C'</text>
  <text x="100" y="50" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">D'</text>
  <text x="70" y="258" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#334155">AB ∥ DC, AA' ∥ DD' ⇒ (ABB'A') ∥ (DCC'D')</text>
