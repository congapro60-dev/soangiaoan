<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img" aria-label="Tam giác vuông với ba cạnh a, b, c; đường tròn nội tiếp bán kính r; công thức Heron và r = S/p">
  <path d="M 60 60 L 360 60 L 360 240 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <path d="M 346 60 L 346 74 L 360 74" fill="none" stroke="#0f172a" stroke-width="2"/>
  <circle cx="295" cy="125" r="65" fill="#dbeafe" fill-opacity="0.55" stroke="#2563eb" stroke-width="2"/>
  <circle cx="295" cy="125" r="3.5" fill="#2563eb"/>
  <line x1="295" y1="125" x2="295" y2="60" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="200" y="46" font-size="15" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#334155">a</text>
  <text x="372" y="155" font-size="15" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#334155">b</text>
  <text x="180" y="165" font-size="15" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#334155">c</text>
  <text x="276" y="88" font-size="14" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#dc2626">r</text>
  <text x="268" y="122" font-size="14" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#2563eb">I</text>
  <text x="96" y="264" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#334155">p = (a+b+c)/2 · S = √(p(p−a)(p−b)(p−c)) · S = p·r</text>
</svg>
