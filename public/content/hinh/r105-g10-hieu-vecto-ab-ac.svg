<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 330" role="img" aria-label="Tam giác ABC vuông tại A có AB nhỏ hơn AC: hiệu vectơ AB - vectơ AC = vectơ CB">
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/></marker>
  </defs>
  <path d="M 70 280 L 290 280 L 70 60 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <path d="M 70 266 L 84 266 L 84 280" fill="none" stroke="#0f172a" stroke-width="2"/>
  <line x1="70" y1="280" x2="280" y2="280" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="70" y1="280" x2="70" y2="70" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="70" y1="60" x2="278" y2="278" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="52" y="300" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">A</text>
  <text x="298" y="300" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">B</text>
  <text x="52" y="52" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">C</text>
  <text x="160" y="302" font-size="15" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#2563eb">AB</text>
  <text x="30" y="180" font-size="15" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#16a34a">AC</text>
  <text x="240" y="196" font-size="15" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#dc2626">CB</text>
  <text x="30" y="318" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#334155">vectơ AB − AC = vectơ CB; BC = √(AB²+AC²)</text>
</svg>
