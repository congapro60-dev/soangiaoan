<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="Miền nghiệm trên hệ trục Oxy: tứ giác O, A(6;0), B(4;4), C(0;6) giới hạn bởi hai đường thẳng x+2y=12 và 2x+y=12">
  <polygon points="60,240 150,240 120,180 60,150" fill="#dbeafe" fill-opacity="0.8" stroke="none"/>
  <line x1="20" y1="240" x2="420" y2="240" stroke="#0f172a" stroke-width="2"/>
  <line x1="60" y1="280" x2="60" y2="30" stroke="#0f172a" stroke-width="2"/>
  <path d="M 420 240 L 410 235 L 410 245 Z" fill="#0f172a"/>
  <path d="M 60 30 L 55 40 L 65 40 Z" fill="#0f172a"/>
  <line x1="60" y1="150" x2="300" y2="270" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="60" y1="60" x2="177" y2="294" stroke="#dc2626" stroke-width="2.5"/>
  <text x="404" y="230" font-size="15" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">x</text>
  <text x="70" y="42" font-size="15" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">y</text>
  <text x="44" y="260" font-size="15" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">O</text>
  <text x="142" y="262" font-size="14" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">A(6;0)</text>
  <text x="130" y="172" font-size="14" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">B(4;4)</text>
  <text x="64" y="144" font-size="14" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">C(0;6)</text>
  <text x="222" y="220" font-size="13" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#2563eb">x + 2y = 12</text>
  <text x="74" y="124" font-size="13" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#dc2626" transform="rotate(63 74 124)">2x + y = 12</text>
  <text x="72" y="288" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#334155">Miền nghiệm: OABC với x ≥ 0, y ≥ 0</text>
</svg>
