<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 352" role="img" aria-label="Hình chữ nhật ABCD có AB nhỏ hơn AD: vectơ AB và vectơ AD cùng gốc A, vectơ tổng AC theo quy tắc hình bình hành">
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/></marker>
  </defs>
  <path d="M 90 50 L 300 50 L 300 290 L 90 290 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <line x1="90" y1="50" x2="290" y2="50" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="90" y1="50" x2="90" y2="280" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="90" y1="50" x2="296" y2="288" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="76" y="38" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">A</text>
  <text x="308" y="38" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">B</text>
  <text x="308" y="304" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">C</text>
  <text x="76" y="304" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0f172a">D</text>
  <text x="176" y="38" font-size="15" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#2563eb">AB</text>
  <text x="52" y="170" font-size="15" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#2563eb">AD</text>
  <text x="206" y="166" font-size="15" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#dc2626">AC</text>
  <text x="60" y="340" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#334155">vectơ AB + vectơ AD = vectơ AC (đường chéo hình bình hành)</text>
</svg>
